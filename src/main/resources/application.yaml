frontend:
  url: ${FRONTEND_URL}

auth:
  refresh-cookie:
    name: refreshToken
    http-only: true
    secure: ${REFRESH_COOKIE_SECURE:true}
    same-site: ${REFRESH_COOKIE_SAME_SITE:None}
    path: /auth


